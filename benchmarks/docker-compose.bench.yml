# Bench Postgres: fixed resources + pg_stat_statements. Bench-only dummy credentials.
name: upsprint-bench
services:
  db:
    image: postgres:16
    container_name: upsprint-bench-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: upsprint_bench
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
    volumes:
      - bench_pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    cpus: 2
    mem_limit: 2g
    shm_size: 512mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d upsprint_bench"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  bench_pgdata:
